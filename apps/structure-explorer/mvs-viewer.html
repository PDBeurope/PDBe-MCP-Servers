<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>PDBe Custom Molecular View</title></head>
<body>
  <main>
    <header class="brand-header">
      <img class="pdbe-logo" src="./src/assets/pdbe-letterhead-white.webp" alt="PDBe — Protein Data Bank in Europe" width="145" height="50" />
      <div class="header-title"><span class="eyebrow">Structural evidence</span><h1>MolViewSpec Builder</h1></div>
    </header>
    <section class="toolbar"><div><h1 id="title">Molecular view</h1><p id="description"></p></div>
      <button id="reset" type="button" disabled>Restore scene</button>
      <button id="download" type="button" disabled>Save MVSJ</button>
    </section>
    <p id="status" role="status" aria-live="polite">Waiting for a scene…</p>
    <div id="story-layout">
      <div id="viewer" aria-label="Interactive molecular structure"></div>
      <aside id="story-panel" aria-label="Story" hidden>
        <nav class="story-navigation" aria-label="Story scenes">
          <button id="story-prev" type="button" disabled>Previous</button>
          <button id="story-next" type="button" disabled>Next</button>
        </nav>
        <h2 id="story-title">Story</h2>
        <div id="story-text"></div>
      </aside>
    </div>
    <section class="scene-details"><ul id="legend" aria-label="Scene components"></ul><p id="selection">Select a residue or atom to inspect it.</p>
      <p id="warnings"></p><p id="source"></p><small>Mol* 5.13.1 · Complete scenes and stories support host-directed viewer updates.</small></section>
  </main>
  <script type="module" src="/src/mvs-main.ts"></script>
</body>
</html>
