name: CI

on:
  push:
    branches: [ main, develop, search ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  apps:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/structure-explorer
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: apps/structure-explorer/package-lock.json

    - name: Install frontend dependencies
      run: npm ci

    - name: Test frontend
      run: npm test

    - name: Build app resources
      run: npm run build

    - name: Upload app resources
      uses: actions/upload-artifact@v4
      with:
        name: mcp-app-resources
        path: |
          pdbe_mcp_server/ui/structure-explorer.html
          pdbe_mcp_server/ui/structure-comparison.html
          pdbe_mcp_server/ui/mvs-viewer.html
        if-no-files-found: error

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        uv sync --all-extras --dev

    - name: Run ruff linter
      run: uv run ruff check .

    - name: Run ruff formatter
      run: uv run ruff format --check .

    - name: Run type checker
      run: uv run pyright

    - name: Run tests with coverage
      run: |
        uv run pytest --cov=pdbe_mcp_server --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  build:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [test, apps]

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3

    - name: Download app resources
      uses: actions/download-artifact@v4
      with:
        name: mcp-app-resources
        path: pdbe_mcp_server/ui

    - name: Build package
      run: uv build

    - name: Verify packaged app resources
      run: uv run python scripts/check_app_artifacts.py dist --require-sdist

    - name: Check package
      run: |
        uv run twine check dist/*

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: build
    environment: release
    permissions:
      id-token: write

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Publish package
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: ${{ secrets.PYPI_USERNAME }}
        password: ${{ secrets.PYPI_PASSWORD }}
